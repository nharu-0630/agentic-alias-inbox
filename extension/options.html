<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Alias Inbox 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Agentic Alias Inbox</h1>

    <section aria-labelledby="settings-heading">
      <h2 id="settings-heading">接続設定</h2>
      <form id="settings-form" novalidate>
        <label for="workerUrl">Worker URL</label>
        <input id="workerUrl" name="workerUrl" type="url" placeholder="https://inbox.4zk.net" autocomplete="off" required>
        <p class="error" id="workerUrl-error"></p>

        <label for="clientId">Client ID (CF-Access-Client-Id)</label>
        <input id="clientId" name="clientId" type="text" placeholder="xxxxxxxx.access" autocomplete="off" spellcheck="false" required>
        <p class="error" id="clientId-error"></p>

        <label for="clientSecret">Client Secret (CF-Access-Client-Secret)</label>
        <input id="clientSecret" name="clientSecret" type="password" autocomplete="new-password" spellcheck="false" required>
        <p class="error" id="clientSecret-error"></p>

        <label for="domain">ドメイン</label>
        <input id="domain" name="domain" type="text" placeholder="4zk.net" autocomplete="off" spellcheck="false" required>
        <p class="error" id="domain-error"></p>

        <div class="actions">
          <button type="submit">保存</button>
          <button type="button" id="test-button" class="secondary">接続テスト</button>
        </div>
        <div id="settings-status" class="status" role="status"></div>
      </form>
      <p class="hint">保存時に Worker の URL へのアクセス許可を求めます。Client Secret はこの端末の chrome.storage.local に保存されます。</p>
    </section>

    <section aria-labelledby="aliases-heading">
      <div class="aliases-header">
        <h2 id="aliases-heading">作成したアドレス <span id="alias-count" class="count"></span></h2>
        <input id="filter" type="search" placeholder="サイトまたはアドレスで検索" aria-label="サイトまたはアドレスで検索">
      </div>
      <p class="hint">「記録を削除」はこの拡張機能の記録だけを消します。サーバー上のメールボックスは残ります。</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>アドレス</th><th>サイト</th><th>作成日時</th><th>メモ</th><th></th></tr>
          </thead>
          <tbody id="alias-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="hint" hidden>まだアドレスはありません。</p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
